            transform-origin: left;
            transform-style: preserve-3d;
            transition: all 1s ease-in-out;
        }
        .cover svg {
            backface-visibility: hidden;
        }
        .clicked {
            transform: perspective(2000px) rotateZ(0deg);
            scale: 1.3;
            box-shadow: 10px 0 20px rgba(0, 0, 0, 0.4),

        }
        .clicked .cover {
            transform: rotateY(-135deg);

        }
        .content {
            width: 100%;
            height: 100%;
            padding: 2rem;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: left;
            font-size: 11px;
        }
        .text {
            font-size: 1.2rem; /* or larger */
            line-height: 1.6;
            text-align: left;
            white-space: pre-wrap; /* preserve line breaks */
            word-wrap: break-word;
            overflow-wrap: break-word;
            height: 2ch;
            transform: translateY(-3ch);
            z-index: -1;
            mix-blend-mode: difference;
        }
        .arrow {
            background: url(arrow.png);
            background-size: cover;
            width: 50px;
            height: 35px;
            position: absolute;
            bottom: 0;
            right: 0;
            margin: 20px;
            z-index: -1;
        }
        .hide {
            display: none;
        }
        .cake {
            opacity: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            bottom: 50%;
            transform: translateY(calc(50% + 90px)) scale(1.5);
            z-index: -1;
        }
        .cake svg {
            width: 100%;
        }
        @keyframes fadein {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .overlay{
            position: absolute;
            top:0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: 0;
            /* animation: glow 2s infinite; */
        }
        @keyframes glow {
            0% {box-shadow: inset 0 0 0px white;}
            50% {box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.562);}
            100% {box-shadow:inset 0 0 0px white;}
        }
@media screen and (max-width: 600px) {

    height: 30px;

}

<script>
// typewriter.js

function typeText(selector, text, speed = 40, callback) {
    const element = document.querySelector(selector);
    if (!element) return;

    element.textContent = ''; // Clear existing text
    let i = 0;

    function type() {
        if (i < text.length) {
            element.textContent += text.charAt(i);
            i++;
            setTimeout(type, speed);
        } else if (callback) {
            callback();
        }
    }

    type();
}
</script>

<script>
var i = 1;
const params = new URLSearchParams(window.location.search);
const name = params.get('name') || 'Dear';
const m1 = params.get('m1') || 'Life is better with teachers like you in it.';
const m2 = params.get('m2') || 'Wishing you a day that hits different.';
const m3 = params.get('m3') || "Happy Teachers' Day " + name + " Sir!";
function handleCardClick(card) {
  if (i == 1){
    // startFireworks(500);
    audio = document.getElementById('audio');
    audio.play();
    card.classList.add("clicked");

    const message = m1;
    typeText("#typedText", message, 40);
    i++;
}
  else if (i == 2) {
    const message = m2;
    // document.querySelector('.card').style = 'scale: 1.2; transform: rotateZ(-10deg) perspective(2000px);';
    typeText("#typedText", message, 40);
    i++;
  }
  else if (i == 3){
    document.querySelector('.cake').style = 'animation: fadein 0.5s forwards';
    // document.querySelector('.card').style = 'scale: 1.3; transform: rotateZ(0deg) perspective(2000px);';
    document.getElementById('arrow').style = 'display: none;';
    startFireworks(700);
    const message = m3;
    typeText("#typedText", message, 40);
    i++;
  }
}
</script>
<script>
const canvas = document.getElementById('fireworkCanvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let fireworks = [];
let interval;
let animating = false;
let backgroundOpacity = 0;
let fadeInProgress = false;

class Particle {
  constructor(x, y, color, angle, speed, decay) {
    this.x = x;
    this.y = y;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.alpha = 1;
    this.decay = decay;
    this.color = color;
    this.radius = Math.random() * 2 + 1;
  }

  update() {
    this.vx *= 0.98;
    this.vy *= 0.98;
    this.vy += 0.05;
    this.x += this.vx;
    this.y += this.vy;
    this.alpha -= this.decay;
  }

  draw(ctx) {
    ctx.save();
    ctx.globalAlpha = this.alpha;
    ctx.fillStyle = this.color;
    ctx.shadowColor = this.color;
    ctx.shadowBlur = 20;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  isDead() {
    return this.alpha <= 0;
  }
}

class Rocket {
  constructor(x, targetY, color) {
    this.x = x;
    this.y = canvas.height;
    this.targetY = targetY;
    this.color = color;
    this.vy = - (Math.random() * 3 + 7);
    this.exploded = false;
    this.particles = [];
  }

  update() {
    if (!this.exploded) {
      this.y += this.vy;
      this.vy += 0.1;
      if (this.y <= this.targetY || this.vy >= 0) {
        this.explode();
      }
    } else {
      this.particles.forEach(p => p.update());
      this.particles = this.particles.filter(p => !p.isDead());
    }
  }

  explode() {
    this.exploded = true;
    const count = 80 + Math.floor(Math.random() * 40);
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 5 + 2;
      const decay = Math.random() * 0.015 + 0.015;
      this.particles.push(new Particle(this.x, this.y, this.color, angle, speed, decay));
    }
  }

  draw(ctx) {
    if (!this.exploded) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
      ctx.fillStyle = this.color;
      ctx.shadowColor = this.color;
      ctx.shadowBlur = 15;
      ctx.fill();
      ctx.restore();
    } else {
      this.particles.forEach(p => p.draw(ctx));
    }
  }

  isDone() {
    return this.exploded && this.particles.length === 0;
  }
}

function animate() {
  if (!animating) return;
  requestAnimationFrame(animate);

  // slowly fade in black background
  if (fadeInProgress && backgroundOpacity < 1) {
    backgroundOpacity += 0.01;
  }

  ctx.fillStyle = `rgba(0, 0, 0, ${backgroundOpacity})`;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  fireworks.forEach(fw => {
    fw.update();
    fw.draw(ctx);
  });
  fireworks = fireworks.filter(fw => !fw.isDone());
}

function launchRocket() {
  const x = Math.random() * canvas.width;
  const targetY = Math.random() * canvas.height * 0.5 + 100;
  const color = `hsl(${Math.random() * 360}, 100%, 60%)`;
  fireworks.push(new Rocket(x, targetY, color));
}

// 🔥 Start Fireworks with Custom Spawn Rate
function startFireworks(spawnRate = 300) {
  if (animating) return;
  backgroundOpacity = 0;
  fadeInProgress = true;
  animating = true;
  animate();
  interval = setInterval(() => {
    const count = 1 + Math.floor(Math.random() * 3);
    for (let i = 0; i < count; i++) launchRocket();
  }, spawnRate);
}

function stopFireworks() {
  animating = false;
  fadeInProgress = false;
  clearInterval(interval);
  fireworks = [];
  backgroundOpacity = 0;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  canvas.style.backgroundColor = "transparent";
}

window.addEventListener("resize", () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});
</script>
